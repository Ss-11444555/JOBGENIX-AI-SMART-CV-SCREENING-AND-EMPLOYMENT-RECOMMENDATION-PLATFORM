<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - JobGenix AI</title>
    <link rel="stylesheet" href="../../css/main.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body.auth-page { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .auth-card { max-width: 480px; width: 100%; }
    </style>
</head>
<body class="auth-page">
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <div class="auth-logo">
                    <i class="fas fa-robot"></i>
                    <span>JobGenix</span>
                    <span class="auth-badge">AI</span>
                </div>
                <h1>Reset Password</h1>
                <p>Request a reset token or complete your reset below.</p>
            </div>

            <div class="auth-body">
                <form id="forgotForm" class="auth-form" style="margin-bottom: 12px;">
                    <div class="form-group">
                        <label for="forgotEmail" class="form-label">Email Address</label>
                        <input type="email" id="forgotEmail" class="form-control" placeholder="you@gmail.com" required>
                    </div>
                    <button type="submit" class="auth-submit">
                        <i class="fas fa-paper-plane"></i> Send Reset Token
                    </button>
                </form>

                <div class="auth-divider">
                    <span>Have a token?</span>
                </div>

                <form id="resetForm" class="auth-form">
                    <div class="form-group">
                        <label for="resetEmail" class="form-label">Email Address</label>
                        <input type="email" id="resetEmail" class="form-control" placeholder="you@gmail.com" required>
                    </div>
                    <div class="form-group">
                        <label for="resetToken" class="form-label">Reset Token</label>
                        <input type="text" id="resetToken" class="form-control" placeholder="Paste token" required>
                    </div>
                    <div class="form-group">
                        <label for="resetPassword" class="form-label">New Password</label>
                        <input type="password" id="resetPassword" class="form-control" placeholder="New password" required>
                    </div>
                    <button type="submit" class="auth-submit">
                        <i class="fas fa-key"></i> Reset Password
                    </button>
                </form>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:8000';

        const forgotForm = document.getElementById('forgotForm');
        forgotForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('forgotEmail').value;
            const btn = forgotForm.querySelector('.auth-submit');
            const original = btn.innerHTML;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Sending...';
            btn.disabled = true;
            try {
                const res = await fetch(`${API_BASE}/api/auth/forgot-password`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });
                const data = await res.json();
                alert(data.message || data.error || 'Request processed.');
            } catch (err) {
                alert('Unable to send reset token right now.');
            } finally {
                btn.innerHTML = original;
                btn.disabled = false;
            }
        });

        const resetForm = document.getElementById('resetForm');
        resetForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('resetEmail').value;
            const token = document.getElementById('resetToken').value;
            const password = document.getElementById('resetPassword').value;
            const btn = resetForm.querySelector('.auth-submit');
            const original = btn.innerHTML;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Resetting...';
            btn.disabled = true;
            try {
                const res = await fetch(`${API_BASE}/api/auth/reset-password`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, token, password })
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error || 'Reset failed');
                alert('Password updated. You can now log in.');
                window.location.href = 'login.html';
            } catch (err) {
                alert(err.message || 'Unable to reset password.');
            } finally {
                btn.innerHTML = original;
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
