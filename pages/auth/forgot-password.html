<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - JobGenix AI</title>
    <link rel="stylesheet" href="../../css/main.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body.auth-page { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .auth-card { max-width: 480px; width: 100%; }
    </style>
</head>
<body class="auth-page">
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <div class="auth-logo">
                    <i class="fas fa-robot"></i>
                    <span>JobGenix</span>
                    <span class="auth-badge">AI</span>
                </div>
                <h1>Forgot Password</h1>
                <p>Enter your email and we’ll create a reset token for you.</p>
            </div>

            <div class="auth-body">
                <form id="forgotForm" class="auth-form">
                    <div class="form-group">
                        <label for="email" class="form-label">Email Address</label>
                        <input type="email" id="email" class="form-control" placeholder="you@gmail.com" required>
                    </div>
                    <button type="submit" class="auth-submit">
                        <i class="fas fa-paper-plane"></i> Send Reset Token
                    </button>
                </form>
                <div class="auth-divider">
                    <span>Have a token?</span>
                </div>
                <div class="text-center">
                    <a href="reset-password.html" class="btn btn-outline btn-block">
                        <i class="fas fa-key"></i> Go to Reset Page
                    </a>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:8000';
        const form = document.getElementById('forgotForm');
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const btn = form.querySelector('.auth-submit');
            const original = btn.innerHTML;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Sending...';
            btn.disabled = true;
            try {
                const res = await fetch(`${API_BASE}/api/auth/forgot-password`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });
                const data = await res.json();
                alert(data.message || data.error || 'Request processed.');
                if (data.token) {
                    localStorage.setItem('reset_email', email);
                    localStorage.setItem('reset_token', data.token);
                }
            } catch (err) {
                alert('Unable to send reset token right now.');
            } finally {
                btn.innerHTML = original;
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
