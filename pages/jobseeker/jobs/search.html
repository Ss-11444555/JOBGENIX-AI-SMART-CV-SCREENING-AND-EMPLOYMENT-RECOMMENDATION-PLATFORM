<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Search Jobs - JobGenix AI</title>
    <!-- Page specific -->
    <link rel="stylesheet" href="/css/main-jobseeker.css">
    <link rel="stylesheet" href="/css/pages/jobseeker/side_bar.css?v=2" />
    <link rel="stylesheet" href="/css/pages/jobseeker/jobs.css?v=3" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* lightweight modal for job details */
        .job-modal { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; z-index: 900; }
        .job-modal__backdrop { position: absolute; inset: 0; background: rgba(0,0,0,0.45); backdrop-filter: blur(2px); }
        .job-modal__content { position: relative; background: #fff; max-width: 720px; width: 92%; max-height: 90vh; overflow-y: auto; border-radius: 14px; box-shadow: 0 20px 50px rgba(15,23,42,0.18); padding: 18px 20px 22px; }
        .job-modal__close { position: absolute; top: 10px; right: 12px; border: none; background: #f3f4f6; border-radius: 50%; width: 34px; height: 34px; font-size: 18px; cursor: pointer; }
        .job-modal__header { margin-bottom: 12px; }
        .job-modal__meta { display: flex; flex-wrap: wrap; gap: 10px; color: #475569; font-size: 14px; }
        .job-modal__pill { background: #eef2ff; color: #4338ca; border-radius: 999px; padding: 6px 10px; font-weight: 600; font-size: 12px; }
        .job-modal__section { margin-top: 14px; }
        .job-modal__section h4 { margin: 0 0 6px 0; }
        .job-modal__list { display: flex; flex-wrap: wrap; gap: 6px; }
        .job-modal__list span { background: #f8fafc; border: 1px solid #e2e8f0; padding: 6px 8px; border-radius: 8px; font-size: 12px; }
    </style>
</head>
<body class="jobseeker-layout pushed " id ="main-content">
     <!-- LEFT SIDEBAR -->
    <aside class="sidebar-jobseeker open">
        <div class="sidebar-brand">
            <div class="brand-title">JobGenix AI</div>
            <div class="brand-pill">Job Seeker</div>
        </div>

        <nav class="sidebar-nav">
            <a href="/pages/jobseeker/dashboard.html" class="nav-item ">
                <span class="nav-icon">
                    <img src="../../../css/assets/images/overview.png" alt="Navigation Icon" class="icon-image">
                </span>
                <span class="nav-label">Overview</span>
            </a>
            <a href="/pages/jobseeker/analytics.html" class="nav-item">
                <span class="nav-icon">
                    <img src="../../../css/assets/images/analytics.png" alt="Navigation Icon" class="icon-image">
                </span>
                <span class="nav-label">Application Analytics</span>
            </a>
            <a href="/pages/jobseeker/applications.html" class="nav-item">
                <span class="nav-icon">
                    <img src="../../../css/assets/images/application.png" alt="Navigation Icon" class="icon-image">
                </span>
                <span class="nav-label">Applications</span>
            </a>
            <a href="/pages/jobseeker/jobs/search.html" class="nav-item active">
                <span class="nav-icon">
                   <img src="../../../css/assets/images/jobsearch.png" alt="Navigation Icon" class="icon-image">
                </span>
                <span class="nav-label">Job Search</span>
            </a>
            <a href="/pages/jobseeker/mock-interview.html" class="nav-item">
                <span class="nav-icon">
                    <img src="../../../css/assets/images/interview.png" alt="Navigation Icon" class="icon-image">
                </span>
                <span class="nav-label">Mock Interview</span>
            </a>
            <a href="/pages/jobseeker/messages.html" class="nav-item">
                <span class="nav-icon">
                    <img src="../../../css/assets/images/message.png" alt="Navigation Icon" class="icon-image">
                </span>
                <span class="nav-label">Messages</span>
            </a>
            <a href="/pages/jobseeker/profile.html" class="nav-item">
                <span class="nav-icon">
                    <img src="../../../css/assets/images/profile.png" alt="Navigation Icon" class="icon-image">
                </span>
                <span class="nav-label">Profile</span>
            </a>
            <a href="/pages/jobseeker/settings.html" class="nav-item">
                <span class="nav-icon">
                   <img src="../../../css/assets/images/settings.png" alt="Navigation Icon" class="icon-image">
                </span>
                <span class="nav-label">Settings</span>
            </a>
        </nav>

        <div class="sidebar-footer">
            <button id="jobseekerLogoutBtn" class="btn btn-ghost">
                <i class="fas fa-sign-out-alt"></i>Logout
            </button>
        </div>
    </aside>
   <!-- TOP BAR -->
    <header class="top-bar">
        <div class="top-bar-left">
            <div class="header-row-container">
                <button class="menu-button" aria-expanded="false" aria-controls="sidebar-menu">
                    <img src="../../../css/assets/images/menu-white.png" alt="Menu Icon" class="icon-image">
                </button>
            </div>
            <div class="header-text-group">
                <h1 class="page-title" >Search Jobs</h1>
                <p class="page-subtitle" >Find opportunities that match your skills and preferences.</p>
            </div>
        </div>
    </header>

    <main class="main-content jobs-page">

        <!-- Filters -->
        <section class="card jobs-filters-card">
            <form id="jobSearchForm" class="jobs-filters">
                <div class="field-group">
                    <label for="keyword">Keyword: </label>
                    <input id="keyword" name="keyword" type="text"
                           placeholder="e.g. Data Scientist, React, Python" />
                </div>

                <div class="field-group">
                    <label for="location">Location: </label>
                    <input id="location" name="location" type="text"
                           placeholder="e.g. Cairo, Remote" />
                </div>

                <div class="field-group">
                <div>
                    <label for="jobType">Job Type: </label>
                </div>
                    <select id="jobType" name="jobType">
                        <option value="">Any</option>
                        <option value="Full-time">Full-time</option>
                        <option value="Part-time">Part-time</option>
                        <option value="Contract">Contract</option>
                        <option value="Internship">Internship</option>
                        <option value="Remote">Remote</option>
                    </select>
                </div>

                <div class="field-group">
                    <div>
                    <label for="experience">Experience level: </label>
                    </div>
                    <select id="experience" name="experience">
                        <option value="">Any</option>
                        <option value="Junior">Junior</option>
                        <option value="Mid">Mid</option>
                        <option value="Senior">Senior</option>
                        <option value="Lead">Lead</option>
                    </select>
                </div>

                <div class="field-group actions">
                    <button type="submit" class="btn btn-primary">Search</button>
                </div>
            </form>
        </section>

        <!-- Results -->
        <section class="jobs-results-section">
            <div class="section-header">
                <h2>Results</h2>
                <span id="resultsCount" class="results-count"></span>
            </div>

            <div id="jobsResults" class="jobs-results-list">
                <!-- job cards injected by JS -->
            </div>

            <p id="noResultsMessage" class="no-results" style="display:none;">
                No jobs found. Try changing your filters.
            </p>
        </section>
    </main>

    <div id="jobDetailsModal" class="job-modal" aria-hidden="true">
        <div class="job-modal__backdrop"></div>
        <div class="job-modal__content">
            <button id="jobModalClose" class="job-modal__close" aria-label="Close">&times;</button>
            <div id="jobModalBody"></div>
        </div>
    </div>
    
    <script src="/js/components/sidebar_animation_jobseeker.js?v=6"></script>
    <script type="module" src="/js/components/sidebar.js?v=2"></script>
    <script src="/js/pages/jobseeker/job.js?v=4"></script>
</body>
</html>
