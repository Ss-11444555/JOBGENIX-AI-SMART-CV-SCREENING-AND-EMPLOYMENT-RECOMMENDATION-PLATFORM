<!-- components/sidebar.html -->
<div class="sidebar" id="sidebar">
    <div class="sidebar-header">
        <a href="/" class="sidebar-brand">
            <i class="fas fa-robot sidebar-brand-logo"></i>
            <div class="sidebar-brand-text">
                <span>JobMatch</span>
                <span class="sidebar-badge">AI</span>
            </div>
        </a>
    </div>
    
    <div class="sidebar-user" id="sidebarUser">
        <!-- User info will be populated -->
    </div>
    
    <div class="sidebar-nav" id="sidebarNav">
        <!-- Navigation will be populated based on user type -->
    </div>
    
    <div class="sidebar-footer">
        <a href="/pages/auth/login.html" class="btn btn-outline btn-block btn-sm logout-btn" id="logoutBtn">
            <i class="fas fa-sign-out-alt"></i> Logout
        </a>
    </div>
</div>

<button class="sidebar-toggle" id="sidebarToggle">
    <i class="fas fa-bars"></i>
</button>

<script>
    // Sidebar functionality
    class Sidebar {
        constructor() {
            this.init();
        }
        
        init() {
            this.setupToggle();
            this.loadUserData();
            this.renderSidebar();
        }
        
        setupToggle() {
            const toggle = document.getElementById('sidebarToggle');
            const sidebar = document.getElementById('sidebar');
            
            if (toggle && sidebar) {
                toggle.addEventListener('click', () => {
                    sidebar.classList.toggle('active');
                });
                
                // Close sidebar when clicking outside on mobile
                document.addEventListener('click', (e) => {
                    if (window.innerWidth <= 1024) {
                        if (!sidebar.contains(e.target) && !toggle.contains(e.target) && sidebar.classList.contains('active')) {
                            sidebar.classList.remove('active');
                        }
                    }
                });
            }
        }
        
        loadUserData() {
            const userJson = localStorage.getItem('user');
            if (userJson) {
                try {
                    this.user = JSON.parse(userJson);
                    this.token = localStorage.getItem('token');
                } catch (e) {
                    console.error('Failed to parse user data:', e);
                }
            }
        }
        
        renderSidebar() {
            this.renderUserSection();
            this.renderNavigation();
        }
        
        renderUserSection() {
            const userSection = document.getElementById('sidebarUser');
            if (!userSection || !this.user) return;
            
            const initials = this.getUserInitials();
            const role = this.user.user_type?.replace('_', ' ') || 'User';
            
            userSection.innerHTML = `
                <div class="user-avatar-large">${initials}</div>
                <div class="user-info-large">
                    <div class="user-name-large">${this.user.name || 'User'}</div>
                    <div class="user-role-large">${role}</div>
                </div>
            `;
        }
        
        renderNavigation() {
            const navSection = document.getElementById('sidebarNav');
            if (!navSection || !this.user) return;
            
            let navigation = [];
            
            switch(this.user.user_type) {
                case 'job_seeker':
                    navigation = [
                        {
                            label: 'Main',
                            items: [
                                { href: '/pages/jobseeker/dashboard.html', icon: 'fas fa-home', text: 'Dashboard' },
                                { href: '/pages/jobseeker/jobs/search.html', icon: 'fas fa-search', text: 'Find Jobs' },
                                { href: '/pages/jobseeker/jobs/matches.html', icon: 'fas fa-heart', text: 'AI Matches', badge: 'AI' },
                                { href: '/pages/jobseeker/jobs/saved.html', icon: 'fas fa-bookmark', text: 'Saved Jobs' }
                            ]
                        },
                        {
                            label: 'Applications',
                            items: [
                                { href: '/pages/jobseeker/applications.html', icon: 'fas fa-file-alt', text: 'My Applications' },
                                { href: '/pages/jobseeker/interviews.html', icon: 'fas fa-video', text: 'Interviews' },
                                { href: '/pages/jobseeker/offers.html', icon: 'fas fa-award', text: 'Job Offers' }
                            ]
                        },
                        {
                            label: 'Profile',
                            items: [
                                { href: '/pages/jobseeker/profile.html', icon: 'fas fa-user', text: 'My Profile' },
                                { href: '/pages/jobseeker/cv.html', icon: 'fas fa-file-pdf', text: 'My CV' },
                                { href: '/pages/jobseeker/skills.html', icon: 'fas fa-code', text: 'Skills' },
                                { href: '/pages/jobseeker/settings.html', icon: 'fas fa-cog', text: 'Settings' }
                            ]
                        },
                        {
                            label: 'Tools',
                            items: [
                                { href: '/pages/jobseeker/analytics.html', icon: 'fas fa-chart-bar', text: 'Analytics' },
                                { href: '/pages/jobseeker/ai-interview.html', icon: 'fas fa-robot', text: 'AI Interview Prep', badge: 'NEW' },
                                { href: '/pages/jobseeker/career-insights.html', icon: 'fas fa-chart-line', text: 'Career Insights' },
                                { href: '/pages/jobseeker/salary-guide.html', icon: 'fas fa-money-bill-wave', text: 'Salary Guide' }
                            ]
                        }
                    ];
                    break;
                    
                case 'company':
                    navigation = [
                        {
                            label: 'Overview',
                            items: [
                                { href: '/pages/company/dashboard.html', icon: 'fas fa-home', text: 'Dashboard' },
                                { href: '/pages/company/analytics.html', icon: 'fas fa-chart-bar', text: 'Analytics' },
                                { href: '/pages/company/notifications.html', icon: 'fas fa-bell', text: 'Notifications' }
                            ]
                        },
                        {
                            label: 'Jobs',
                            items: [
                                { href: '/pages/company/jobs/list.html', icon: 'fas fa-briefcase', text: 'All Jobs' },
                                { href: '/pages/company/jobs/create.html', icon: 'fas fa-plus-circle', text: 'Create Job' },
                                { href: '/pages/company/jobs/drafts.html', icon: 'fas fa-edit', text: 'Drafts' },
                                { href: '/pages/company/jobs/archived.html', icon: 'fas fa-archive', text: 'Archived' }
                            ]
                        },
                        {
                            label: 'Candidates',
                            items: [
                                { href: '/pages/company/candidates/list.html', icon: 'fas fa-users', text: 'All Candidates' },
                                { href: '/pages/company/candidates/matches.html', icon: 'fas fa-heart', text: 'AI Matches', badge: 'AI' },
                                { href: '/pages/company/candidates/shortlisted.html', icon: 'fas fa-star', text: 'Shortlisted' },
                                { href: '/pages/company/candidates/interviews.html', icon: 'fas fa-video', text: 'Interviews' }
                            ]
                        },
                        {
                            label: 'Company',
                            items: [
                                { href: '/pages/company/settings/profile.html', icon: 'fas fa-building', text: 'Company Profile' },
                                { href: '/pages/company/settings/team.html', icon: 'fas fa-user-friends', text: 'Team Members' },
                                { href: '/pages/company/settings/billing.html', icon: 'fas fa-credit-card', text: 'Billing' },
                                { href: '/pages/company/settings/integrations.html', icon: 'fas fa-plug', text: 'Integrations' }
                            ]
                        }
                    ];
                    break;
                    
                case 'admin':
                    navigation = [
                        {
                            label: 'Overview',
                            items: [
                                { href: '/pages/admin/dashboard.html', icon: 'fas fa-home', text: 'Dashboard' },
                                { href: '/pages/admin/analytics.html', icon: 'fas fa-chart-bar', text: 'Analytics' },
                                { href: '/pages/admin/reports.html', icon: 'fas fa-file-alt', text: 'Reports' }
                            ]
                        },
                        {
                            label: 'Users',
                            items: [
                                { href: '/pages/admin/users.html', icon: 'fas fa-users', text: 'All Users' },
                                { href: '/pages/admin/users/job-seekers.html', icon: 'fas fa-user-tie', text: 'Job Seekers' },
                                { href: '/pages/admin/users/companies.html', icon: 'fas fa-building', text: 'Companies' },
                                { href: '/pages/admin/users/admins.html', icon: 'fas fa-user-shield', text: 'Admins' }
                            ]
                        },
                        {
                            label: 'Content',
                            items: [
                                { href: '/pages/admin/jobs.html', icon: 'fas fa-briefcase', text: 'Jobs' },
                                { href: '/pages/admin/applications.html', icon: 'fas fa-file-alt', text: 'Applications' },
                                { href: '/pages/admin/categories.html', icon: 'fas fa-tags', text: 'Categories' },
                                { href: '/pages/admin/skills.html', icon: 'fas fa-code', text: 'Skills Library' }
                            ]
                        },
                        {
                            label: 'System',
                            items: [
                                { href: '/pages/admin/settings.html', icon: 'fas fa-cog', text: 'Settings' },
                                { href: '/pages/admin/ai-config.html', icon: 'fas fa-robot', text: 'AI Configuration' },
                                { href: '/pages/admin/logs.html', icon: 'fas fa-clipboard-list', text: 'System Logs' },
                                { href: '/pages/admin/backup.html', icon: 'fas fa-database', text: 'Backup & Restore' }
                            ]
                        }
                    ];
                    break;
            }
            
            // Add active class based on current page
            const currentPath = window.location.pathname;
            
            navSection.innerHTML = navigation.map(section => `
                <div class="sidebar-section">
                    <div class="section-label">${section.label}</div>
                    ${section.items.map(item => {
                        const isActive = currentPath === item.href || currentPath.startsWith(item.href + '/');
                        const badge = item.badge ? `<span class="sidebar-link-badge">${item.badge}</span>` : '';
                        
                        return `
                            <a href="${item.href}" class="sidebar-link ${isActive ? 'active' : ''}">
                                <div class="sidebar-link-icon">
                                    <i class="${item.icon}"></i>
                                </div>
                                <div class="sidebar-link-text">${item.text}</div>
                                ${badge}
                            </a>
                        `;
                    }).join('')}
                </div>
            `).join('');
        }
        
        getUserInitials() {
            if (!this.user || !this.user.name) return 'U';
            return this.user.name
                .split(' ')
                .map(part => part[0])
                .join('')
                .toUpperCase()
                .substring(0, 2);
        }
    }
    
    // Initialize sidebar when component loads
    document.addEventListener('DOMContentLoaded', () => {
        window.Sidebar = new Sidebar();
    });
</script>
