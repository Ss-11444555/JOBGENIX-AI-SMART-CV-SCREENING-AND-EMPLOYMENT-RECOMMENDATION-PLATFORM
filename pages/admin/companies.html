<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Company Management · JobMatch AI</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="../../css/main.css">
    <link rel="stylesheet" href="../../css/pages/admin/dashboard.css">
</head>
<body class="admin-dashboard">
    <div id="sidebar"></div>
    <main class="main-content">
        <div id="navbar"></div>
        <section class="dashboard-header">
            <div class="container">
                <div class="header-content">
                    <div class="user-welcome">
                        <h1>Company Management</h1>
                        <p>Monitor, edit, and verify company profiles from a single place.</p>
                    </div>
                    <div class="header-actions">
                        <button class="btn btn-primary" id="refreshCompanies">
                            <i class="fas fa-sync-alt"></i> Refresh
                        </button>
                        <button class="btn btn-outline" id="companyLogout">
                            <i class="fas fa-sign-out-alt"></i> Logout
                        </button>
                    </div>
                </div>
            </div>
        </section>

        <section class="panel-card" style="margin-bottom:1.5rem">
            <div class="panel-card-header">
                <div>
                    <p class="panel-title">Filters & Search</p>
                </div>
            </div>
            <div class="user-filter-grid">
                <input type="text" id="companySearch" placeholder="Search by name, industry, description" class="form-input" />
                <select id="companyVerifiedFilter" class="form-input">
                    <option value="">All companies</option>
                    <option value="true">Verified only</option>
                    <option value="false">Unverified only</option>
                </select>
                <button class="btn btn-primary" id="applyCompanyFilter">Apply</button>
            </div>
        </section>

        <section class="panel-card">
            <div class="panel-card-header">
                <div>
                    <h3>Companies</h3>
                    <span class="panel-subtitle" id="companyCount">0 companies</span>
                </div>
                <button class="btn btn-outline" id="newCompanyBtn">Add company</button>
            </div>
            <div class="table-responsive">
                <table class="users-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Industry</th>
                            <th>Website</th>
                            <th>Verified</th>
                            <th>Contact</th>
                            <th>Created</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="companyRows">
                        <tr><td colspan="8" class="table-placeholder">Loading companies…</td></tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <script>
        (function ensureAdminAuth() {
            try {
                const keys = ['authToken', 'token', 'jobgenix_token'];
                const token = keys.map((k) => localStorage.getItem(k)).find(Boolean);
                const user = JSON.parse(localStorage.getItem('user') || '{}');
                if (!token || !user.user_type || user.user_type !== 'admin') {
                    history.replaceState(null, '', '/pages/auth/login.html');
                    window.location.replace('/pages/auth/login.html');
                }
            } catch (err) {
                window.location.replace('/pages/auth/login.html');
            }
        })();
    </script>
    <script src="../../js/app.js"></script>
    <script src="../../js/pages/admin/companies.js"></script>
    <script>
        fetch('../../components/sidebar.html')
            .then((response) => (response.ok ? response.text() : ""))
            .then((html) => {
                if (html) {
                    document.getElementById('sidebar').innerHTML = html;
                }
            });
        fetch('../../components/navbar.html')
            .then((response) => (response.ok ? response.text() : ""))
            .then((html) => {
                if (html) {
                    document.getElementById('navbar').innerHTML = html;
                }
            });
    </script>
</body>
</html>
