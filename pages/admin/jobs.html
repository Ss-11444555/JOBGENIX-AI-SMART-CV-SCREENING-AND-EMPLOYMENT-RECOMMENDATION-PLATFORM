<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Job Management · JobMatch AI</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="../../css/main.css">
    <link rel="stylesheet" href="../../css/pages/admin/dashboard.css">
</head>
<body class="admin-dashboard">
    <div id="sidebar"></div>
    <main class="main-content">
        <div id="navbar"></div>
        <section class="dashboard-header">
            <div class="container">
                <div class="header-content">
                    <div class="user-welcome">
                        <h1>Job Moderation</h1>
                        <p>Review active postings and remove any suspicious or outdated listings.</p>
                    </div>
                    <div class="header-actions">
                        <button class="btn btn-primary" id="refreshJobs">
                            <i class="fas fa-sync-alt"></i> Refresh
                        </button>
                        <button class="btn btn-outline" id="jobsLogout">
                            <i class="fas fa-sign-out-alt"></i> Logout
                        </button>
                    </div>
                </div>
            </div>
        </section>

        <section class="panel-card" style="margin-bottom:1.5rem">
            <div class="panel-card-header">
                <div>
                    <p class="panel-title">Search & Filter</p>
                </div>
            </div>
            <div class="user-filter-grid">
                <input type="text" id="jobSearch" placeholder="Search by title, company, location" class="form-input" />
                <select id="jobStatusFilter" class="form-input">
                    <option value="">All statuses</option>
                    <option value="open">Open</option>
                    <option value="pending">Pending</option>
                    <option value="closed">Closed</option>
                </select>
                <button class="btn btn-primary" id="applyJobFilter">Apply</button>
            </div>
        </section>

        <section class="panel-card">
            <div class="panel-card-header">
                <div>
                    <h3>Active Positions</h3>
                    <span class="panel-subtitle" id="jobCount">0 jobs</span>
                </div>
            </div>
            <div class="table-responsive">
                <table class="users-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Title</th>
                            <th>Company</th>
                            <th>Status</th>
                            <th>Location</th>
                            <th>Created</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="jobRows">
                        <tr><td colspan="7" class="table-placeholder">Loading jobs…</td></tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <script>
        (function ensureAdminAuth() {
            try {
                const keys = ['authToken', 'token', 'jobgenix_token'];
                const token = keys.map((k) => localStorage.getItem(k)).find(Boolean);
                const user = JSON.parse(localStorage.getItem('user') || '{}');
                if (!token || !user.user_type || user.user_type !== 'admin') {
                    history.replaceState(null, '', '/pages/auth/login.html');
                    window.location.replace('/pages/auth/login.html');
                }
            } catch (err) {
                window.location.replace('/pages/auth/login.html');
            }
        })();
    </script>
    <script src="../../js/app.js"></script>
    <script src="../../js/pages/admin/jobs.js"></script>
    <script>
        fetch('../../components/sidebar.html')
            .then((response) => (response.ok ? response.text() : ""))
            .then((html) => {
                if (html) {
                    document.getElementById('sidebar').innerHTML = html;
                }
            });
        fetch('../../components/navbar.html')
            .then((response) => (response.ok ? response.text() : ""))
            .then((html) => {
                if (html) {
                    document.getElementById('navbar').innerHTML = html;
                }
            });
    </script>
</body>
</html>
